[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eegfm"
version = "0.1.0"
description = "Self-supervised EEG foundation model pretraining and reproducible benchmarking (Paper 1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harel Wilner" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "torch",
]

[project.optional-dependencies]
dev = ["pytest"]
edf = ["pyedflib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
